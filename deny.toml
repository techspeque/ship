# cargo-deny policy for the Rust workspace. CI job `audit` runs
# `cargo deny check` (advisories, bans, licenses, sources) on every push and
# pull request. The web packages have the same licence policy in
# scripts/web-licenses.mjs.

[graph]
# Only what ships: the four release targets.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# Every RustSec vulnerability fails the build; so do unmaintained and
# unsound crates in the graph. An exception goes in `ignore` with the
# advisory id and a reason, reviewed like code.
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences, plus MPL-2.0 (file-level copyleft, compatible with an
# MIT-licensed binary).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates are `publish = false`; their licence is the
# workspace's MIT, checked like any other.
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
