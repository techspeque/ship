version: 1
slices:
    - id: fix-0006
      title: 'The documented non-root install leaves a daemon systemd cannot start: service install accepts a binary under a home directory'
      type: fix
      priority: p0
      risk: high
      stage: foundation
      coder: claude-code/opus-5-5
      reviewer: codex/gpt-6-astra
      plan: .metis/plans/phase-0-plan.md
      plan_section: §0.8
      coded: false
      reviewed: false
      review_cycles: 1
      notes: 'Found at the Phase 0 gate (scenario 1) on v0.0.1, on gate host A and gate host B (Ubuntu 26.04, x86_64, systemd 259). Path followed exactly as documented: ''curl -fsSL .../v0.0.1/install.sh | sh -s -- --version v0.0.1'' as the login user. /usr/local/bin is not writable, so install.sh (scripts/install.sh:202-208) chose $HOME/.local/bin and then printed ''to run the daemon under systemd: sudo $prefix/ship service install'' (scripts/install.sh:227). The Human ran ''sudo ~/.local/bin/ship service install'', ''sudo systemctl start ship'', ''sudo usermod -aG ship USER'', rebooted. Result on both hosts: /etc/systemd/system/ship.service has ''ExecStart=/home/USER/.local/bin/ship daemon --state /var/lib/ship --socket /run/ship/ship.sock''; the home directory is mode 0750 (drwxr-x---), so the ship user cannot traverse it; journal: ''ship.service: Failed to execute /home/USER/.local/bin/ship: Permission denied'' / ''status=203/EXEC''; Restart=always loops forever (NRestarts 131 and 147 when checked); /run/ship does not exist. install already detects this (crates/ship/src/service.rs:310 exe_reachability_warning) but only prints a warning, after every change has been made, followed by ''Start the daemon: sudo systemctl start ship''. On host B ship is also not on the PATH of a non-interactive ssh session (~/.local/bin is added only by the login profile), so the laptop''s ssh target fails with ''ship was not found''; on host A a stale pre-release /usr/local/bin/ship is found instead of v0.0.1. Required: (1) ship service install refuses, in preflight before any change, a binary the ship user could not execute: any ancestor directory without o+x, or a path under a home directory (/home, /root, or the invoking SUDO_USER''s home); the refusal names the path and gives the exact command ''sudo install -m 0755 <current path> /usr/local/bin/ship'' followed by ''sudo /usr/local/bin/ship service install''; exit 1, host untouched (no group, user, dirs or unit). The existing warning becomes this refusal. (2) scripts/install.sh on Linux, when the final prefix is a per-user one (under $HOME, or not executable by others), does not print the service install hint; it says the daemon needs a system path and prints the exact ''sudo install -m 0755 $prefix/ship /usr/local/bin/ship'' and ''sudo /usr/local/bin/ship service install'' lines; also say the binary must be on the PATH of non-interactive ssh sessions for ssh targets. The /usr/local/bin case keeps today''s hint. (3) A regression test of the non-root path end to end in CI: in the service job (scripts/service-smoke.sh or a new step beside it), install with install.sh as the unprivileged runner user into a prefix under a 0750 home, run ''sudo <that path> service install'', assert exit 1, the refusal text with the install command, and that no ship user, group, unit, /var/lib/ship or /run/ship was created; then follow the printed command and assert the service starts. Unit tests in service.rs for the refusal (o-x ancestor, home path) with no mutating calls. Update docs/service.md and README.md install text to match. Out of scope: changing install.sh''s default prefix choice, PATH management, Phase 1 work. After the fix the Human repairs both hosts with sudo (move the binary to /usr/local/bin, remove the stale one on host A, re-run service install, reboot) and the gate is re-run from scenario 1.'
      created: "2026-11-27"
