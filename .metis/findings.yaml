      evidence: test newer_schema_in_committed_wal_is_refused_and_untouched
    - id: f-003
      date: "2026-11-25"
      slice: phase-0-ws-0.4
      severity: P2
      category: tests
      finding: 'crates/ship-net/src/listener.rs:162-165 — Independent metis verify --post --slice phase-0-ws-0.4 --force exits 1: socket_has_mode_0660_and_accepts, remove_leaves_a_successor_socket, stale_socket_is_replaced, regular_file_is_refused_and_untouched, and remove_deletes_own_socket fail with PermissionDenied. The process-wide 0177 umask removes owner directory-search permission from concurrently created temporary directories; overlapping calls can also restore masks out of order. Make socket creation preserve the brief’s restrictive permissions without corrupting concurrent filesystem creation or leaving the process mask changed, add concurrency regression coverage, and restore a green verification run.'
      status: resolved
      resolved_by: commit 34d3fc1883eb; test concurrent_file_creation_is_unaffected; Independent forced metis verify --post passed.
      cycle: 1
      file: crates/ship-net/src/listener.rs
      commit: 34d3fc1883ebc29b2900e42efcc3b281dda6562f
      evidence: test concurrent_file_creation_is_unaffected
    - id: f-004
      date: "2026-11-25"
      slice: phase-0-ws-0.4
      severity: P2
      category: behavior
      finding: 'crates/ship-daemon/src/lib.rs:187-198 — Shutdown applies a separate 10-second timeout to each listener and aborts only the Axum serving tasks, leaving their connection tasks alive. Reproduced with a partial GET header on each transport: shutdown returned after 20.005 seconds, then completing the TCP request returned HTTP 200 after shutdown. This violates the brief’s up-to-10-second drain and connection closure. Use a shared drain deadline and ensure remaining connection tasks are terminated and joined before shutdown returns; add a regression with incomplete requests on both transports.'
      status: resolved
      resolved_by: commit fb10cc872d3f; test incomplete_requests_are_closed_within_one_deadline; Independent forced metis verify --post passed.
      cycle: 1
      file: crates/ship-daemon/src/lib.rs
      commit: fb10cc872d3fd22b011ae0f922d759344982e49a
      evidence: test incomplete_requests_are_closed_within_one_deadline
    - id: f-005
      date: "2026-11-25"
      slice: phase-0-ws-0.4
      severity: P2
      category: behavior
      finding: 'crates/ship-daemon/src/log.rs:62-67 — Redacting raw byte patterns across the serialized record corrupts JSON syntax for valid registered secrets. Reproduced by registering a single double-quote: a JSON record becomes {[redacted]fields[redacted]:{[redacted]message[redacted]:[redacted]hello [redacted] secret[redacted]}}, which cannot be parsed as JSON. Preserve JSON structure while redacting secret-bearing values and add regression coverage for quote/backslash-only and numeric secrets, asserting that emitted records remain parseable and secret values are removed.'
      status: resolved
      resolved_by: commit 69d4cd94540b; test json_syntax_and_numeric_secrets_keep_records_parseable; Independent forced metis verify --post passed.
      cycle: 1
      file: crates/ship-daemon/src/log.rs
      commit: 69d4cd94540b3f69c035772a1e500b5e78b95647
      evidence: test json_syntax_and_numeric_secrets_keep_records_parseable
