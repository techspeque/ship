      slice: phase-0-ws-0.6
      severity: P2
      category: behavior
      finding: 'crates/ship-net/src/client.rs:178 — SSH failure cleanup waits outside the configured whole-exchange timeout (brief lines 74-85): a fake ssh that closes stdout then execs sleep 60 makes projects --timeout 1 take 3.145 seconds and report HTTP EOF instead of timeout. Bound exchange, exit-status collection and stderr collection by one deadline, kill/reap ssh on expiry, and add an early-EOF-but-still-running regression test.'
