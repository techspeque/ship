      date: "2026-11-25"
      slice: phase-0-ws-0.8
      severity: P2
      category: correctness
      finding: crates/ship/src/service.rs:427-468 — An existing ship user with a primary GID different from the ship group is accepted, and that passwd GID is used to chown both directories, violating the brief requirement of ship:ship ownership. Reinstall while running changes /run/ship (0750) to the other group and denies socket traversal to ship-group clients. Resolve the ship group GID via getent group ship and use it for both directory owners; add a regression covering an existing user with a different primary group and repeat install.
