name: release

# A `v*` tag builds the four release archives (linux amd64/arm64 static
# musl binaries, macOS amd64/arm64), checks the Linux binaries, writes the
# SBOM and SHA256SUMS, signs every file with Sigstore cosign (keyless, this
# workflow's GitHub OIDC identity), verifies the result with
# scripts/install.sh, and publishes a GitHub release (ADR-0012 rule 2).
#
# workflow_dispatch is a dry run: everything up to signing, nothing
# published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version guard
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # On a tag, the tag must be `v` + the workspace version. A dry run uses
      # that tag name without creating it.
      - id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(awk '
            /^\[workspace\.package\]/ { s = 1; next }
            /^\[/ { s = 0 }
            s && $1 == "version" { gsub(/"/, "", $3); print $3 }
          ' Cargo.toml)
          [ -n "$version" ] || { echo "no [workspace.package] version in Cargo.toml"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
            if [ "$tag" != "v$version" ]; then
              echo "tag $tag does not match workspace version v$version"
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release $tag (version $version)"

  ui:
    name: build the UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Build web/dist
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [version, ui]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: linux, arch: amd64, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: darwin, arch: amd64, runner: macos-latest }
          - { target: aarch64-apple-darwin, os: darwin, arch: arm64, runner: macos-latest }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      # A missing web/dist fails the build instead of embedding no UI.
      SHIP_REQUIRE_UI: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show active-toolchain
      # Native musl build on each Linux arch: musl-gcc compiles the bundled
      # SQLite C code, so no cross toolchain is involved.
      - name: Install musl tools, strace, file
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools strace file
          echo "CC_${TARGET//-/_}=musl-gcc" >>"$GITHUB_ENV"
      - name: Build
        run: |
          export SHIP_COMMIT="${GITHUB_SHA:0:12}"
          cargo build --release --locked -p ship --target "$TARGET"
          echo "BIN=$PWD/target/$TARGET/release/ship" >>"$GITHUB_ENV"
      - name: Version line
        if: matrix.os == 'linux' || matrix.arch == 'arm64'
        run: |
          line=$("$BIN" --version)
          echo "$line"
          case "$line" in
            "ship $VERSION (commit ${GITHUB_SHA:0:12}, "*) ;;
            *) echo "unexpected version line"; exit 1 ;;
          esac
      # The plan's acceptance: runs with no Rust, Node.js or libraries.
      - name: Static binary, no libraries, no network
        if: matrix.os == 'linux'
        run: |
          file "$BIN"
          file "$BIN" | grep -Eq 'statically linked|static-pie linked'
          if ldd "$BIN" 2>&1 | grep -q '=>'; then
            echo "dynamic dependencies found"; ldd "$BIN"; exit 1
          fi
          docker run --rm --network none -v "$BIN:/ship:ro" busybox:1.37 /ship --version
      - name: No network request on any Phase 0 command
        if: matrix.os == 'linux'
        run: bash scripts/no-network-smoke.sh "$BIN"
      - name: Package
        run: |
          name="ship-$TAG-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "pkg/$name" dist
          cp "$BIN" LICENSE README.md "pkg/$name/"
          chmod 0755 "pkg/$name/ship"
          tar -czf "dist/$name.tar.gz" -C pkg "$name"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  sbom-and-sums:
    name: SBOM and checksums
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      # Syft over the source tree: Cargo.lock and web/package-lock.json.
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/ship-${{ needs.version.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SHA256SUMS
        run: |
          count=$(ls dist/ship-"$TAG"-*.tar.gz | wc -l)
          [ "$count" -eq 4 ] || { echo "expected 4 archives, found $count"; exit 1; }
          cd dist
          sha256sum ship-"$TAG"-*.tar.gz "ship-$TAG.spdx.json" >SHA256SUMS
          cat SHA256SUMS
          cp ../scripts/install.sh .
      - uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: dist
          if-no-files-found: error

  publish:
    name: sign, verify, publish
    if: github.ref_type == 'tag'
    needs: [version, sbom-and-sums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless signing identity
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-unsigned
          path: dist
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: |
          cd dist
          for f in ship-"$TAG"-*.tar.gz "ship-$TAG.spdx.json" SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      # The installer users run, against exactly these files, with real
      # cosign: the good release installs; a changed archive and a bundle
      # that belongs to another file are refused.
      - name: Verify with install.sh
        run: |
          sh scripts/install.sh --from dist --version "$TAG" --prefix "$RUNNER_TEMP/good"
          "$RUNNER_TEMP/good/ship" --version

          cp -R dist "$RUNNER_TEMP/t1"
          printf 'x' >>"$RUNNER_TEMP/t1/ship-$TAG-linux-amd64.tar.gz"
          if sh scripts/install.sh --from "$RUNNER_TEMP/t1" --version "$TAG" --prefix "$RUNNER_TEMP/p1"; then
            echo "tampered archive was installed"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/p1/ship"

          cp -R dist "$RUNNER_TEMP/t2"
          cp "$RUNNER_TEMP/t2/ship-$TAG.spdx.json.sigstore.json" "$RUNNER_TEMP/t2/SHA256SUMS.sigstore.json"
          if sh scripts/install.sh --from "$RUNNER_TEMP/t2" --version "$TAG" --prefix "$RUNNER_TEMP/p2"; then
            echo "swapped signature bundle was accepted"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/p2/ship"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Pre-alpha. The CLI, API and storage formats may change before v1.0.

          Install (verifies the cosign signature and SHA-256 before installing):

              curl -fsSLO https://github.com/$REPO/releases/download/$TAG/install.sh
              less install.sh
              sh install.sh --version $TAG
          EOF
          gh release create "$TAG" dist/* \
            --repo "$REPO" --verify-tag --prerelease \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
