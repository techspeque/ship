[package]
name = "ship"
description = "Ship: turn a folder into a running, observable application on a Linux machine you own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
ship-core = { path = "../ship-core" }
ship-daemon = { path = "../ship-daemon" }
ship-net = { path = "../ship-net" }
# Scans and packs the snapshot `ship push` sends (ADR-0005).
ship-source = { path = "../ship-source" }
bytes = "1"
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }

[dev-dependencies]
ship-docker = { path = "../ship-docker" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
