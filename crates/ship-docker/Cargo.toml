[package]
name = "ship-docker"
description = "Ship adapter for docker and docker compose subprocesses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ship-core = { path = "../ship-core" }
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
