[package]
name = "ship-daemon"
description = "Ship daemon: HTTP API, operation queue, reconciler and UI serving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ship-core = { path = "../ship-core" }
ship-docker = { path = "../ship-docker" }
ship-net = { path = "../ship-net" }
ship-source = { path = "../ship-source" }
ship-store = { path = "../ship-store" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Already in the graph through axum; the SSE body stream and catching a
# panicking operation job.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
# Already in the graph: request bodies, and the release config fingerprint.
serde = "1"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

[dev-dependencies]
# Already in the graph through ship-store; a test makes revision writes fail.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
