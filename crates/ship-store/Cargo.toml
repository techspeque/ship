[package]
name = "ship-store"
description = "Ship SQLite access and migrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ship-core = { path = "../ship-core" }
getrandom = "0.3"
# Already in the graph through ship-core; encodes a release's image list.
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
# Already in the graph through sqlx's runtime-tokio; used for the bounded wait in `Store::close`.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
