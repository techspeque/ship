[package]
name = "ship-net"
description = "Ship listeners, ssh dial-stdio and tailscaled local-API client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ship-core = { path = "../ship-core" }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2"
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "time"] }
